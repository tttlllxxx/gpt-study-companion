name: Build desktop releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: TARGET_ARCH=x86_64 ./build.sh
      - run: cp 'GPT 学习伴侣.app/Contents/MacOS/GPTStudyCompanion' .build/intel
      - run: TARGET_ARCH=arm64 ./build.sh
      - run: lipo -create .build/intel 'GPT 学习伴侣.app/Contents/MacOS/GPTStudyCompanion' -output .build/universal
      - run: cp .build/universal 'GPT 学习伴侣.app/Contents/MacOS/GPTStudyCompanion' && codesign --force --deep --sign - 'GPT 学习伴侣.app'
      - run: '"./GPT 学习伴侣.app/Contents/MacOS/GPTStudyCompanion" --self-test -ApplePersistenceIgnoreState YES'
      - run: ditto -c -k --sequesterRsrc --keepParent 'GPT 学习伴侣.app' GPTStudyCompanion-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: GPTStudyCompanion-macOS-universal.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --title "GPT 学习伴侣 $RELEASE_TAG" --notes "包含 Windows x64 便携版和 macOS 13+ Universal（Apple Silicon / Intel）原生版。首次运行按系统提示打开；本版本未使用商业证书签名或 Apple 公证。"
